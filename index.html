<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>رحلة الأندلس 2031</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
:root{--blue:#123a91;--deep:#08255f;--cyan:#0b9eb8;--gold:#d7b06d;--ink:#12213c;--muted:#68758b;--paper:#f8fbff;--ok:#11865b;--bad:#b23b4b}
*{box-sizing:border-box} body{margin:0;font-family:Tajawal,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 0,#e6f6ff 0,transparent 35%),linear-gradient(145deg,#f7fbff,#eef3fb);min-height:100vh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(2px);opacity:.28;z-index:-1}body:before{width:300px;height:300px;background:#8ed4e5;left:-120px;bottom:-100px}body:after{width:260px;height:260px;background:#e7cf9e;right:-100px;top:-90px}
.shell{width:min(980px,94vw);margin:0 auto;padding:24px 0 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:54px;height:54px;border-radius:15px;background:linear-gradient(145deg,var(--blue),#0d68bd);color:#fff;display:grid;place-items:center;font-weight:800;font-size:25px;box-shadow:0 10px 25px #123a9130}.brand b{display:block;color:var(--blue);font-size:20px}.brand small{color:var(--muted)}.timer{background:#fff;border:1px solid #dce6f3;border-radius:999px;padding:10px 15px;font-weight:800;color:var(--deep);box-shadow:0 8px 24px #1a3d7012}.progress{height:7px;background:#dde7f2;border-radius:99px;overflow:hidden;margin-bottom:18px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--gold));transition:.45s}
.card{background:#ffffffeb;border:1px solid #e2e9f4;border-radius:28px;min-height:560px;padding:clamp(24px,5vw,58px);box-shadow:0 22px 70px #173b701c;position:relative;overflow:hidden}.card:after{content:"";position:absolute;inset:auto -40px -80px auto;width:220px;height:220px;border:34px solid #0b9eb811;border-radius:50%;pointer-events:none}.eyebrow{color:var(--cyan);font-weight:800;font-size:14px;letter-spacing:.04em}.step{animation:rise .4s ease}.step h1{font-size:clamp(34px,6vw,62px);line-height:1.1;margin:14px 0 16px;color:var(--deep)}.step h2{font-size:clamp(25px,4vw,40px);margin:8px 0 14px;color:var(--deep)}.lead{font-size:clamp(18px,2.3vw,23px);line-height:1.8;max-width:760px;color:#42516a}.gold{color:#b48432}.pillrow{display:flex;flex-wrap:wrap;gap:9px;margin:24px 0}.pill{background:#edf5ff;color:var(--blue);padding:9px 14px;border-radius:99px;font-weight:700}.actions{display:flex;gap:12px;align-items:center;margin-top:30px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:13px 22px;font:700 17px Tajawal;cursor:pointer;transition:.2s}.primary{background:linear-gradient(135deg,var(--blue),#0b65b6);color:#fff;box-shadow:0 9px 20px #123a9138}.primary:hover{transform:translateY(-2px)}.ghost{background:#eef3f9;color:var(--blue)}
.options{display:grid;gap:12px;margin-top:24px}.option{width:100%;text-align:right;padding:17px 18px;border-radius:16px;border:2px solid #e3eaf3;background:#fff;font:600 17px Tajawal;color:var(--ink);cursor:pointer;transition:.18s}.option:hover{border-color:#8fb8e8;background:#f7fbff;transform:translateX(-3px)}.option.correct{border-color:#4db78c;background:#effbf6;color:#086541}.option.wrong{border-color:#d97c89;background:#fff3f5;color:#8b2434}.option:disabled{cursor:default;transform:none}.feedback{margin-top:16px;padding:14px 16px;border-radius:14px;font-weight:700;display:none}.feedback.show{display:block}.feedback.ok{background:#eaf9f2;color:#08754d}.feedback.no{background:#fff0f2;color:#972c3e}
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.value{border:2px solid #e0e8f2;background:#fff;border-radius:16px;padding:18px 10px;text-align:center;font-weight:800;font-size:18px;cursor:pointer}.value.selected{background:#eaf5ff;border-color:var(--blue);color:var(--blue)}.value.decoy{color:#6d7788}.mini{color:var(--muted);font-size:14px}.counter{font-weight:800;color:var(--blue)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.level{padding:18px 10px;border:1px solid #dae4ef;border-radius:15px;background:#f8fbff;text-align:center}.level b{display:block;font-size:17px;color:var(--blue)}.level span{font-size:13px;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.goal,.bucket{border:2px solid #e0e7f0;border-radius:16px;padding:15px;cursor:pointer;background:#fff}.goal.active{border-color:var(--gold);background:#fff9ed}.goal.done{opacity:.48;pointer-events:none}.bucket{color:var(--blue);font-weight:800;text-align:center}.bucket:hover{border-color:var(--blue)}
.scoreRing{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:20px 0;background:conic-gradient(var(--cyan) var(--pct),#e5edf5 0);position:relative}.scoreRing:after{content:"";position:absolute;inset:13px;background:#fff;border-radius:50%}.scoreRing strong{z-index:1;font-size:37px;color:var(--blue)}.takeaway{border-right:4px solid var(--gold);padding:8px 16px;margin:18px 0;font-size:19px;line-height:1.7;background:#fffaf1;border-radius:8px}.confetti{position:absolute;width:9px;height:16px;top:-20px;animation:fall 3s linear infinite}.tag{display:inline-block;border-radius:8px;background:#e9f6f8;color:#08758a;font-weight:800;padding:4px 9px;margin-left:6px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fall{to{transform:translateY(700px) rotate(540deg)}}
@media(max-width:680px){.card{padding:26px 20px;min-height:600px}.values{grid-template-columns:repeat(2,1fr)}.levels{grid-template-columns:repeat(2,1fr)}.match{grid-template-columns:1fr}.top{align-items:flex-start}.brand small{display:none}.timer{font-size:14px}}
</style>
</head>
<body><main class="shell"><header class="top"><div class="brand"><div class="mark">أ</div><div><b>الأندلس 2031</b><small>من إرثٍ نفخر به إلى مستقبلٍ نصنعه</small></div></div><div class="timer" id="timer">⏱ 04:00</div></header><div class="progress"><div class="bar" id="bar"></div></div><section class="card" id="card"></section></main>
<script>
const card=document.querySelector('#card'),bar=document.querySelector('#bar'),timer=document.querySelector('#timer');
let step=0,score=0,locked=false,seconds=240,chosen=[],activeGoal=null,matches=0;
const data={
values:['المسؤولية','الاستقامة','التعلم','الشراكة','الإحسان','التمكين'],
goals:[['تحقيق النمو المستدام','المخرجات'],['إثراء تجربة العملاء وتعزيز الصورة الذهنية','المعنيون'],['تحقيق التميز في نواتج التعلم','العمليات'],['تعزيز القيم الإسلامية والهوية الوطنية','العمليات'],['تمكين رأس المال البشري','الممكنات'],['تطوير بيئة رقمية مُمكّنة','الممكنات']]
};
setInterval(()=>{if(step>0&&step<6&&seconds>0){seconds--;timer.textContent=`⏱ ${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}},1000);
function layout(html){card.innerHTML=`<div class="step">${html}</div>`;bar.style.width=`${step/6*100}%`}
function next(){step++;locked=false;render()}
function answer(el,ok,explain){if(locked)return;locked=true;[...document.querySelectorAll('.option')].forEach(x=>x.disabled=true);el.classList.add(ok?'correct':'wrong');if(ok)score+=15;else document.querySelector('[data-ok="1"]')?.classList.add('correct');const f=document.querySelector('.feedback');f.className=`feedback show ${ok?'ok':'no'}`;f.textContent=(ok?'أحسنت! ':'قريب! ')+explain;document.querySelector('#continue').style.display='inline-block'}
function render(){
if(step===0)layout(`<div class="eyebrow">لعبة تعريفية • 4 دقائق</div><h1>هل أنت مستعد لصناعة<br><span class="gold">المستقبل معنا؟</span></h1><p class="lead">رحلة قصيرة لاكتشاف أساسيات استراتيجية الأندلس 2026–2031: الرؤية، الرسالة، القيم، استراتيجية المنافسة والأهداف.</p><div class="pillrow"><span class="pill">5 تحديات</span><span class="pill">تغذية راجعة فورية</span><span class="pill">نتيجة شخصية</span></div><div class="actions"><button class="btn primary" onclick="next()">ابدأ الرحلة ←</button></div>`);
if(step===1)layout(`<div class="eyebrow">المحطة 1 من 5 • الرؤية</div><h2>أي عبارة تمثل رؤيتنا؟</h2><p class="lead">اختر الوجهة التي نطمح أن نصل إليها بحلول 2031.</p><div class="options"><button class="option" data-ok="1" onclick="answer(this,true,'الرؤية تصف طموحنا: منظومة رائدة تبني جيلاً بقدرات تعلم عالمية.')">منظومة تعليمية رائدة، تبني جيلاً يمتلك قدرات تعلم عالمية</button><button class="option" onclick="answer(this,false,'هذه ليست صياغة الرؤية المعتمدة.')">توسّع جغرافي يضع عدد المدارس أولاً</button><button class="option" onclick="answer(this,false,'الرؤية تركز على الريادة وقدرات التعلم العالمية.')">منظومة تشغيلية تركّز على الكفاءة المالية فقط</button></div><div class="feedback"></div><div class="actions"><button id="continue" style="display:none" class="btn primary" onclick="next()">التالي</button></div>`);
if(step===2)layout(`<div class="eyebrow">المحطة 2 من 5 • الرسالة</div><h2>أكمل معنى رسالتنا</h2><p class="lead">نبني جيلاً رائداً يحب التعلم، يرعاه فريق مُعدّ في مؤسسة تربوية معاصرة…</p><div class="options"><button class="option" data-ok="1" onclick="answer(this,true,'رسالتنا تجمع الإنسان المؤهل، المؤسسة المعاصرة، القيم الأصيلة وتطلعات المجتمع.')">تحكمها قيم أصيلة وتلبي تطلعات المجتمع</button><button class="option" onclick="answer(this,false,'القيم الأصيلة وتطلعات المجتمع جزء أساسي من الرسالة.')">تقيس النجاح بالانتشار وحده</button><button class="option" onclick="answer(this,false,'الرسالة أوسع من الأدوات التقنية؛ محورها بناء جيل رائد.')">تعتمد على التقنية بدلاً من دور المربي</button></div><div class="feedback"></div><div class="actions"><button id="continue" style="display:none" class="btn primary" onclick="next()">التالي</button></div>`);
if(step===3){chosen=[];layout(`<div class="eyebrow">المحطة 3 من 5 • قيمنا</div><h2>التقط القيم الست</h2><p class="lead">اختر قيم الأندلس من بين البطاقات. <span class="counter" id="count">0 / 6</span></p><div class="values">${[...data.values,'السرعة','المنافسة','الانتشار'].sort(()=>.5-Math.random()).map(v=>`<button class="value ${data.values.includes(v)?'':'decoy'}" data-real="${data.values.includes(v)}" onclick="pick(this,'${v}')">${v}</button>`).join('')}</div><div class="feedback"></div><div class="actions"><button id="continue" style="display:none" class="btn primary" onclick="next()">التالي</button></div>`)}
if(step===4)layout(`<div class="eyebrow">المحطة 4 من 5 • بوصلتنا التنافسية</div><h2>ما الذي يميّزنا في المنافسة؟</h2><div class="options"><button class="option" data-ok="1" onclick="answer(this,true,'استراتيجية المنافسة هي التركيز على الجودة، مدعومة بخبرة تعليمية متنامية وموارد بشرية مميزة وتربية قيمية وبيئة جاذبة.')">التركيز على الجودة وتقديم خدمة تعليمية أعلى جودة وأعمق أثراً</button><button class="option" onclick="answer(this,false,'بوصلتنا هي الجودة والأثر، لا خفض التكلفة.')">خفض التكلفة إلى أدنى مستوى</button><button class="option" onclick="answer(this,false,'التوسع ليس بديلاً عن جودة التجربة التعليمية.')">الانتشار الأسرع بغض النظر عن التجربة</button></div><div class="feedback"></div><div class="actions"><button id="continue" style="display:none" class="btn primary" onclick="next()">التالي</button></div>`);
if(step===5){matches=0;activeGoal=null;layout(`<div class="eyebrow">المحطة 5 من 5 • الأهداف الاستراتيجية</div><h2>اربط الهدف بمستواه</h2><p class="mini">اختر هدفاً، ثم اختر المستوى المناسب. أكمل 4 روابط للفوز.</p><div class="levels"><div class="level"><b>المخرجات</b><span>إلى أين نصل؟</span></div><div class="level"><b>المعنيون</b><span>لمن نصنع القيمة؟</span></div><div class="level"><b>العمليات</b><span>ما الذي نتقنه؟</span></div><div class="level"><b>الممكنات</b><span>ما الذي يدعمنا؟</span></div></div><div class="match"><div id="goalList">${data.goals.slice(0,4).map((g,i)=>`<div class="goal" data-i="${i}" onclick="selectGoal(this,${i})">${g[0]}</div>`).join('')}</div><div>${['المخرجات','المعنيون','العمليات','الممكنات'].map(b=>`<div class="bucket" onclick="dropGoal('${b}')">${b}</div>`).join('')}</div></div><div class="feedback" id="matchFeed"></div><div class="actions"><button id="continue" style="display:none" class="btn primary" onclick="next()">عرض النتيجة</button></div>`)}
if(step===6){bar.style.width='100%';const pct=Math.min(100,score+matches*10);layout(`<div class="eyebrow">اكتملت الرحلة</div><h2>${pct>=80?'أنت صانع أثر!':pct>=60?'انطلاقة قوية!':'بداية موفقة!'}</h2><div class="scoreRing" style="--pct:${pct}%"><strong>${pct}%</strong></div><p class="lead">أصبحت الآن تعرف الأساس الذي يجمعنا في رحلة الأندلس حتى 2031.</p><div class="takeaway"><span class="tag">الخلاصة</span> رؤيتنا تقودنا، قيمنا تضبط قراراتنا، الجودة تميّزنا، والأهداف تحوّل الطموح إلى أثر.</div><div class="actions"><button class="btn primary" onclick="location.reload()">إعادة اللعب</button><button class="btn ghost" onclick="window.print()">طباعة النتيجة</button></div>`);for(let i=0;i<22;i++){let c=document.createElement('i');c.className='confetti';c.style.cssText=`right:${Math.random()*100}%;animation-delay:${Math.random()*2}s;background:${['#123a91','#0b9eb8','#d7b06d'][i%3]}`;card.appendChild(c)}}
}
function pick(el,v){if(el.classList.contains('selected'))return;if(el.dataset.real==='true'){el.classList.add('selected');chosen.push(v);score+=2;document.querySelector('#count').textContent=`${chosen.length} / 6`;if(chosen.length===6){document.querySelector('.feedback').className='feedback show ok';document.querySelector('.feedback').textContent='رائع! قيمنا: المسؤولية، الاستقامة، التعلم، الشراكة، الإحسان والتمكين.';document.querySelector('#continue').style.display='inline-block'}}else{el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),600)}}
function selectGoal(el,i){document.querySelectorAll('.goal').forEach(x=>x.classList.remove('active'));el.classList.add('active');activeGoal=i}
function dropGoal(bucket){if(activeGoal===null)return;const el=document.querySelector(`.goal[data-i="${activeGoal}"]`),f=document.querySelector('#matchFeed');if(data.goals[activeGoal][1]===bucket){el.classList.remove('active');el.classList.add('done');el.textContent+=' ✓';matches++;f.className='feedback show ok';f.textContent='ارتباط صحيح!';activeGoal=null;if(matches===4){document.querySelector('#continue').style.display='inline-block';f.textContent='أحسنت! اكتملت خريطة الأهداف.'}}else{f.className='feedback show no';f.textContent='جرّب مستوى آخر؛ فكّر في دور الهدف داخل الاستراتيجية.'}}
render();
</script></body></html>
